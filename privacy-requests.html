<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitação de Privacidade | Rota do Caso</title><link rel="stylesheet" href="/privacy.css"></head><body><main class="legal"><header><a href="/">← Rota do Caso</a><a href="/privacidade">Política de Privacidade</a></header><h1>Solicitação relativa a dados pessoais</h1><p>Use este canal para solicitar acesso, correção, exclusão ou informações sobre seus dados. Podemos solicitar confirmação de identidade antes de atender o pedido.</p><form id="privacy-request"><label>Nome<input name="name" maxlength="255"></label><label>E-mail<input required name="email" type="email"></label><label>Tipo de solicitação<select required name="type"><option value="access">Acesso aos dados</option><option value="correction">Correção</option><option value="deletion">Exclusão</option><option value="information">Informações</option></select></label><label>Detalhes<textarea name="message" maxlength="5000" rows="5"></textarea></label><button>Enviar solicitação</button><p id="result" class="success" hidden></p></form></main><script src="/privacy-requests.js"></script></body></html>
