<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17263d" />
    <meta name="description" content="Redefina sua senha da Rota do Caso com segurança." />
    <title>Redefinir senha — Rota do Caso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="password-reset.css" />
  </head>
  <body>
    <main class="page-shell">
      <a class="brand" href="/"><span class="brand-mark">R</span><span>Rota<span> do Caso</span></span></a>
      <section class="reset-card" aria-labelledby="reset-title">
        <div class="icon" aria-hidden="true">⌁</div>
        <p class="eyebrow">ACESSO SEGURO</p>
        <h1 id="reset-title">Redefina sua senha</h1>
        <p class="intro" id="reset-intro">Informe o e-mail da sua conta. Enviaremos um código de seis dígitos para continuar.</p>
        <p class="message" id="message" role="alert" hidden></p>

        <form id="email-form">
          <label for="email">E-mail da conta</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="voce@escritorio.com.br" />
          <button type="submit">Enviar código</button>
        </form>

        <form id="reset-form" hidden>
          <label for="code">Código recebido por e-mail</label>
          <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="000000" />
          <label for="password">Nova senha</label>
          <div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Mínimo de 8 caracteres" /><button class="toggle-password" type="button" aria-label="Mostrar senha">Mostrar</button></div>
          <button type="submit">Salvar nova senha</button>
        </form>

        <button class="text-button" id="resend" type="button" hidden>Enviar um novo código</button>
        <a class="back-link" href="/?login=1">Voltar para o login</a>
      </section>
    </main>
    <script src="password-reset.js" defer></script>
  </body>
</html>
